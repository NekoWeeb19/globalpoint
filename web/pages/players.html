            <section class="flex flex-col p-5 border border-outline-variant rounded-3xl w-full gap-4">
                <h2 class="text-2xl text-on-background font-semibold">Active account</h2>

                <label class="flex flex-col gap-1">
                    <span class="text-on-surface">Global app plays on</span>
                    <select id="active-global" class="w-full rounded-2xl border border-outline-variant bg-surface-container-low text-on-surface px-4 py-3"></select>
                </label>
                <label class="flex flex-col gap-1">
                    <span class="text-on-surface">CN app plays on</span>
                    <select id="active-cn" class="w-full rounded-2xl border border-outline-variant bg-surface-container-low text-on-surface px-4 py-3"></select>
                </label>
                <p id="active-message" class="text-sm text-on-surface-variant" role="status"></p>

    <script>
        (function () {
            const message = document.getElementById("active-message")
            const own = { global: "Its own login (the player the game signed in as)", cn: "Its own login (each device gets its own player)" }
            function render(data) {
                for (const app of ["global", "cn"]) {
                    const select = document.getElementById("active-" + app)
                    select.replaceChildren()
                    const first = document.createElement("option")
                    first.value = ""
                    first.textContent = own[app]
                    select.appendChild(first)
                    for (const player of data.players) {
                        const option = document.createElement("option")
                        option.value = String(player.id)
                        option.textContent = player.name + " (player " + player.id + ")"
                        select.appendChild(option)
                    }
                    select.value = data[app] === null ? "" : String(data[app])
                }
            }
            for (const app of ["global", "cn"]) {
                document.getElementById("active-" + app).addEventListener("change", async (event) => {
                    const value = event.target.value
                    event.target.disabled = true
                    try {
                        const response = await fetch("/api/server/account/active", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ app, playerId: value === "" ? null : Number(value) }) })
                        const reply = await response.json()
                        if (!response.ok) throw new Error(reply.message || response.statusText)
                        render(reply)
                        message.textContent = "Saved. Reopen the " + (app === "cn" ? "CN" : "global") + " app to load it."
                    } catch (error) {
                        message.textContent = "Error: " + error.message
                    } finally { event.target.disabled = false }
                })
            }
            fetch("/api/server/account/active").then(r => r.json()).then(render)
                .catch(error => { message.textContent = "Could not load the accounts: " + error.message })
        })()
    </script>
