import java.security.MessageDigest
import java.util.zip.ZipEntry
import java.util.zip.ZipOutputStream

plugins {
    id "com.android.application"
}

// local.properties (not in git):
//   sdk.dir=...                 Android SDK (no spaces in the path: ndk-build refuses them)
//   nodejs.mobile.dir=...       unpacked nodejs-mobile-android zip
//                               (https://github.com/digidem/nodejs-mobile/releases/tag/v24.20.0-0)
//   release.signing=...         optional: a keystore.properties file (storeFile, storePassword,
//                               keyAlias, keyPassword) kept outside the repo; without it the
//                               release APK is left unsigned
def localProps = new Properties()
def localFile = rootProject.file("local.properties")
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def nodeDir = project.findProperty("nodejsMobileDir") ?: localProps.getProperty("nodejs.mobile.dir")
if (!nodeDir) throw new GradleException("Set nodejs.mobile.dir in companion/local.properties (the unpacked nodejs-mobile-android zip)")
nodeDir = file(nodeDir).absolutePath.replace('\\', '/')
def signingProps = new Properties()
def signingFile = localProps.getProperty("release.signing")
if (signingFile && file(signingFile).exists()) file(signingFile).withInputStream { signingProps.load(it) }

android {
    namespace "org.globalpoint.companion"
    compileSdk 36
    buildToolsVersion "36.1.0"
    // ndk-build can't handle spaces in paths: if the SDK path has one, set ndk.dir in local.properties
    // to a space-free link to the NDK
    ndkVersion "27.3.13750724"

    defaultConfig {
        applicationId "org.globalpoint.companion"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.6"
        externalNativeBuild {
            ndkBuild { arguments "NODEJS_MOBILE_DIR=${nodeDir}" }
        }
    }
    // one APK per ABI: arm64-v8a for phones, x86_64 for PC emulators (each ~75 MB instead of ~150 MB)
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk false
        }
    }
    signingConfigs {
        if (signingProps.getProperty("storeFile")) {
            release {
                storeFile file(signingProps.getProperty("storeFile"))
                storePassword signingProps.getProperty("storePassword")
                keyAlias signingProps.getProperty("keyAlias")
                keyPassword signingProps.getProperty("keyPassword")
            }
        }
    }
    buildTypes {
        release {
            // debuggable on purpose: players can copy their save out with
            // `adb shell run-as org.globalpoint.companion` without root (companion/README.md)
            debuggable true
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            if (signingProps.getProperty("storeFile")) signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        ndkBuild { path "src/main/jni/Android.mk" }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    androidResources {
        // server.zip is already compressed
        noCompress += "zip"
    }
}

// Zips companion/build/server-stage (made by `node companion/tools/stage-server.cjs`) into the APK's
// assets as server.zip, with server.version (its SHA-256): the app unpacks the server only when that
// changes.
abstract class BundleServer extends DefaultTask {
    @InputDirectory abstract DirectoryProperty getStage()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def root = stage.get().asFile
        def out = new File(outputDir.get().asFile, "server.zip")
        out.parentFile.mkdirs()
        def files = []
        root.eachFileRecurse { f -> if (f.isFile() && !f.path.contains("${File.separator}.bin${File.separator}")) files << f }
        files.sort { it.path }
        new ZipOutputStream(new FileOutputStream(out)).withCloseable { zip ->
            files.each { f ->
                def entry = new ZipEntry(root.toPath().relativize(f.toPath()).toString().replace('\\', '/'))
                entry.time = 0 // same input, same zip, same version
                zip.putNextEntry(entry)
                f.withInputStream { zip << it }
                zip.closeEntry()
            }
        }
        def digest = MessageDigest.getInstance("SHA-256")
        out.withInputStream { s -> byte[] b = new byte[1 << 16]; int n; while ((n = s.read(b)) > 0) digest.update(b, 0, n) }
        new File(outputDir.get().asFile, "server.version").text = digest.digest().encodeHex().toString()
    }
}

def bundleServer = tasks.register("bundleServer", BundleServer) {
    stage = rootProject.layout.projectDirectory.dir("build/server-stage")
    outputDir = layout.buildDirectory.dir("generated/serverAssets")
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(bundleServer) { it.outputDir }
    }
}
